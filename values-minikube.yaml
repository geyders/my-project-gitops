replicaCount: 4

failRate: "0.5"

rollout:
  enabled: true
  analysis:
    enabled: true
  steps:
    - setWeight: 20
    - pause: {duration: 30s}
    - analysis:
        templates:
          - templateName: my-app-success-rate
    - setWeight: 60
    - pause: {duration: 30s}

metrics:
  enabled: true

image:
  repository: yuliakhudenko/my-app
  tag: "v1.5.0"

service:
  type: NodePort
  port: 80
  targetPort: 8080