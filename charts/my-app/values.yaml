replicaCount: 1

image:
  repository: your-dockerhub-username/my-app
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources: {}

rollout:
  enabled: false
  steps:
    - setWeight: 25
    - pause: {duration: 30s}
    - setWeight: 50
    - pause: {}
    - setWeight: 75
    - pause: {duration: 20s}