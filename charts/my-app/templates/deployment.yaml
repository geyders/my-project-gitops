apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-app.fullname" . | default .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: MONGO_URL
              value: "mongodb://{{ .Release.Name }}-mongo:27017/task_manager"